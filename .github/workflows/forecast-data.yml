name: Forecast data
run-name: ${{ inputs.source == 'timer' && 'Forecast data (on time)' || 'Forecast data' }}

on:
  push:
    branches: [main]
  schedule:
    - cron: "10 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish again even if the latest run is already published (reuses hours already computed from it)"
        type: boolean
        default: false
      recompute:
        description: "With force: also recompute every hour from scratch (slow; only after changing the physics)"
        type: boolean
        default: false
      source:
        description: "Who started it (the on-time trigger sends: timer)"
        type: string
        default: manual

concurrency:
  group: forecast-data
  cancel-in-progress: false

env:
  DATA_PATH_SECRET: ${{ secrets.DATA_PATH_SECRET }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: write # the fallback's look at recent runs; deleting old runs
    env:
      WORKERS: "2"
    steps:
      - uses: actions/checkout@v7

      - name: Already run on time?
        id: late
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          CRON: ${{ github.event.schedule }}
        run: cd pipeline && python3 ontime.py

      - name: Data site
        if: steps.late.outputs.skip != 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_DATA_SITE_ID }}
        run: |
          s="$(curl -fsS --retry 3 --max-time 20 -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")" ||
            { echo "::error::couldn't look up the data site: check NETLIFY_AUTH_TOKEN and NETLIFY_DATA_SITE_ID"; exit 1; }
          while IFS= read -r v; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done < <(jq -r '.name, .default_domain, .custom_domain, .url, .ssl_url, .account_slug, .account_name, .account_id, (.domain_aliases // [])[] | select(. != null)' <<<"$s")
          d="$(jq -r '.default_domain // empty' <<<"$s")"
          if [ -z "$d" ]; then echo "::error::the data site has no address"; exit 1; fi
          echo "DATA_URL=https://$d" >> "$GITHUB_ENV"

      - name: What's new?
        id: check
        if: steps.late.outputs.skip != 'true'
        run: |
          if [ -n "$DATA_PATH_SECRET" ] && ! [[ "$DATA_PATH_SECRET" =~ ^[A-Za-z0-9_-]{16,}$ ]]; then
            echo "DATA_PATH_SECRET must be 16+ letters, digits, - or _"; exit 1
          fi
          O=""; if [ -n "$DATA_PATH_SECRET" ]; then O="/o$(printf '%s:open' "$DATA_PATH_SECRET" | sha256sum | cut -c1-32)"; fi
          if [ -n "$O" ]; then echo "::add-mask::${O#/}"; fi
          cd pipeline && python3 check.py --data-url "$DATA_URL${DATA_PATH_SECRET:+/$DATA_PATH_SECRET}" --open-url "$DATA_URL$O" ${{ inputs.force && '--force' || '' }} ${{ github.event_name == 'push' && '--missing-only --no-wait' || '' }}

      - uses: actions/setup-python@v7
        if: steps.check.outputs.any == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - if: steps.check.outputs.any == 'true'
        run: pip install -r pipeline/requirements.txt && cd pipeline && python -m unittest test_physics

      - name: Make room
        if: steps.check.outputs.any == 'true'
        run: |
          df -h /
          nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift > /dev/null 2>&1 &

      - name: Restore previous data
        id: restore_main
        if: steps.check.outputs.any == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            dist-data
            !dist-data/gfs
            !dist-data/hrrr/20*
          key: forecast-main-${{ github.run_id }}
          restore-keys: forecast-main-
      - name: Restore GFS data
        id: restore_gfs
        if: steps.check.outputs.any == 'true'
        uses: actions/cache/restore@v6
        with:
          path: dist-data/gfs
          key: forecast-gfs-${{ github.run_id }}
          restore-keys: forecast-gfs-
      - name: Restore previous data (single cache)
        if: steps.check.outputs.any == 'true' && steps.restore_main.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: dist-data
          key: forecast-data-none
          restore-keys: forecast-data-

      - name: Models to build
        id: models
        if: steps.check.outputs.any == 'true'
        run: |
          list="${{ steps.check.outputs.models }}"
          for m in hrrr gfs; do
            run="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['runId'])" "dist-data/$m/latest.json" 2>/dev/null || true)"
            if [ -z "$run" ] || [ ! -d "dist-data/$m/$run" ]; then
              rm -f "dist-data/$m/latest.json" # (else build.py finds that run built already)
              if [[ " $list " != *" $m "* ]]; then list="$list $m"; echo "$m: published run not on hand, building it"; fi
            fi
          done
          echo "list=$(echo $list)" >> "$GITHUB_OUTPUT"

      - name: Map data on hand?
        id: mapdata
        if: steps.check.outputs.any == 'true'
        run: |
          if [ -f dist-data/airspace/meta.json ] && [ -f dist-data/airspace/aviation/meta.json ]; then echo "missing=false" >> "$GITHUB_OUTPUT"
          else echo "missing=true" >> "$GITHUB_OUTPUT"; echo "No airspace or aviation map data from the last run: building them"; fi

      - name: Netlify CLI
        if: steps.models.outputs.list != ''
        uses: actions/cache@v6
        with:
          path: /tmp/netlify-cli
          key: netlify-cli-17.38.1

      - name: Build ${{ steps.models.outputs.list }}
        id: build
        if: steps.models.outputs.list != ''
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_DATA_SITE_ID }}
        run: |
          cd pipeline
          built=""
          for m in ${{ steps.models.outputs.list }}; do
            echo "::group::$m"
            if timeout 75m python build.py --model "$m" --out ../dist-data ${{ inputs.force && '--force' || '' }} ${{ inputs.recompute && '--recompute' || '' }}; then
              (cd .. && .github/scripts/pre-upload.sh "$m")
              built="$built $m"
            else
              echo "::warning::$m failed or timed out: its previous run stays published"
            fi
            echo "::endgroup::"
          done
          echo "built=$built " >> "$GITHUB_OUTPUT"
          df -h / && du -sh ../dist-data ../dist-data/*/_hours ../dist-data/*/20*/pt 2>/dev/null || true

      - name: Drop paused models
        if: steps.check.outputs.any == 'true'
        run: |
          for m in $(cd pipeline && python -c 'from sources import PAUSED; print(" ".join(PAUSED))'); do
            if [ -d "dist-data/$m" ] || [ -d "dist-data/free/$m" ] || [ -d "dist-data/free/now/$m" ]; then
              rm -rf "dist-data/$m" "dist-data/free/$m" "dist-data/free/now/$m"
              touch dist-data/.changed
              echo "$m: dropped"
            fi
          done

      - name: Free 24-hour window
        if: steps.check.outputs.free == 'true'
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_DATA_SITE_ID }}
        run: |
          (cd pipeline && python build.py --model hrrr --out ../dist-data --free-only && python build.py --model gfs --out ../dist-data --free-only)
          [ -x /tmp/netlify-cli/node_modules/.bin/netlify ] && .github/scripts/pre-upload.sh free || true

      - name: Airspace
        if: steps.check.outputs.airspace == 'true' || steps.mapdata.outputs.missing == 'true'
        continue-on-error: true
        timeout-minutes: 25
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: cd pipeline && python airspace.py --out ../dist-data

      - name: Aviation map data
        if: steps.check.outputs.aviation == 'true' || steps.mapdata.outputs.missing == 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: cd pipeline && python aviation.py --out ../dist-data

      - name: Anything new?
        id: changed
        if: steps.check.outputs.any == 'true'
        run: |
          for m in hrrr gfs; do
            if [ ! -f "dist-data/$m/latest.json" ]; then echo "::warning::$m has nothing to publish: no deploy this time"; exit 0; fi
          done
          for f in free/hrrr/latest.json free/gfs/latest.json airspace/meta.json airspace/aviation/meta.json; do
            if [ ! -f "dist-data/$f" ]; then echo "::warning::no $f: no deploy this time"; exit 0; fi
          done
          if [ -f dist-data/.changed ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; rm dist-data/.changed; else echo "Nothing new"; fi
      - name: Save data for the next run
        if: steps.changed.outputs.yes == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            dist-data
            !dist-data/gfs
            !dist-data/hrrr/20*
          key: forecast-main-${{ github.run_id }}
      - name: Save GFS data for the next run
        if: steps.changed.outputs.yes == 'true' && hashFiles('dist-data/gfs/latest.json') != '' && (contains(steps.build.outputs.built, ' gfs ') || steps.restore_gfs.outputs.cache-matched-key == '')
        uses: actions/cache/save@v6
        with:
          path: dist-data/gfs
          key: forecast-gfs-${{ github.run_id }}
      - name: Drop replaced caches
        if: steps.changed.outputs.yes == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mine="$(gh api "repos/${{ github.repository }}/actions/caches?key=forecast-main-${{ github.run_id }}" --jq '.total_count')"
          [ "$mine" -ge 1 ] || { echo "this job's cache isn't there: nothing deleted"; exit 0; }
          keep_gfs="$(gh api "repos/${{ github.repository }}/actions/caches?key=forecast-gfs-&sort=created_at&direction=desc&per_page=1" --jq '.actions_caches[0].key // ""')"
          gh api --paginate "repos/${{ github.repository }}/actions/caches?per_page=100" --jq '.actions_caches[] | "\(.id) \(.key)"' |
          while read -r id key; do
            case "$key" in
              forecast-main-${{ github.run_id }}|"$keep_gfs") ;;
              forecast-main-*|forecast-gfs-*|forecast-data-*) gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null && echo "deleted $key" ;;
            esac
          done

      - name: Assemble site
        if: steps.changed.outputs.yes == 'true'
        run: |
          P="${DATA_PATH_SECRET:+/$DATA_PATH_SECRET}"
          mkdir -p "site$P"
          OPEN_EX=(); if [ -n "$DATA_PATH_SECRET" ]; then OPEN_EX=(--exclude '/free/' --exclude '/airspace/'); fi
          rsync -a --delete --link-dest="$PWD/dist-data/" --exclude '_hours/' --exclude '_quarters/' --exclude '*.building/' --exclude '.changed' "${OPEN_EX[@]}" dist-data/ "site$P/"
          sed "s#^/#$P/#" pipeline/data-site/_headers > site/_headers
          if [ -n "$DATA_PATH_SECRET" ]; then
            O="/o$(printf '%s:open' "$DATA_PATH_SECRET" | sha256sum | cut -c1-32)"
            for d in free airspace; do
              if [ -d "dist-data/$d" ]; then mkdir -p "site$O/$d"; rsync -a --link-dest="$PWD/dist-data/$d/" --exclude '*.building/' "dist-data/$d/" "site$O/$d/"; fi
            done
            printf '%s/free/*/20*\n  Cache-Control: public, max-age=31536000, immutable\n%s/airspace/*\n  Cache-Control: public, max-age=3600\n%s/*\n  X-Robots-Tag: noindex, nofollow\n' "$O" "$O" "$O" >> site/_headers
          fi
          printf "User-agent: *\nDisallow: /\n" > site/robots.txt
          printf '[build]\n  publish = "."\n' > site/netlify.toml
          du -sh site; find site -type f | wc -l

      - name: Deploy to Netlify data site
        if: steps.changed.outputs.yes == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_DATA_SITE_ID }}
        working-directory: site
        run: |
          ../.github/scripts/pre-upload.sh --wait
          CLI="$(../.github/scripts/netlify-cli.sh)"
          "$CLI" deploy --prod --dir . --functions /tmp/no-functions --message "forecast ${{ github.run_id }}"

      - name: Keep the schedule on
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SELF: ${{ github.workflow_ref }}
        run: |
          self="${SELF#*/.github/workflows/}"; self="${self%%@*}"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$self/enable" && echo "kept on"

      - name: Delete old runs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SELF: ${{ github.workflow_ref }}
        run: |
          before="$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          self=".github/workflows/${SELF#*/.github/workflows/}"; self="${self%%@*}"
          ids="$(gh api --paginate "repos/${{ github.repository }}/actions/runs?status=completed&per_page=100" \
            --jq ".workflow_runs[] | select((.path | startswith(\".github/workflows/forecast-data\")) and (.path != \"$self\" or .created_at < \"$before\")) | .id")"
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" >/dev/null && echo "deleted $id"
          done
