name: Forecast data
run-name: ${{ inputs.source == 'timer' && 'Forecast data (on time)' || 'Forecast data' }}

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 1 * * *"
    - cron: "0 2,8,14,20 * * *"
    - cron: "30 2,3,5,6,8,10,11,12,14,16,17,18,20,22 * * *"
    - cron: "55 3 * * *"
    - cron: "40 9,15,21 * * *"
    - cron: "20 23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish again even if the latest run is already published (reuses hours already computed from it)"
        type: boolean
        default: false
      recompute:
        description: "With force: also recompute every hour from scratch (slow; only after changing the physics)"
        type: boolean
        default: false
      source:
        description: "Who started it (the on-time trigger sends: timer)"
        type: string
        default: manual
      slot:
        description: "The slot it's for, HH:MM UTC (the on-time trigger sends it; empty: the latest by the clock)"
        type: string
        default: ""

concurrency:
  group: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'no run') || contains(github.event.head_commit.message, 'runs stopped')) && format('forecast-skip-{0}', github.run_id) || ((contains(fromJSON('["02:00","09:40","14:00","21:40"]'), inputs.slot) || github.event.schedule == '0 2,8,14,20 * * *' || github.event.schedule == '40 9,15,21 * * *') && 'forecast-data-long' || 'forecast-data') }}
  cancel-in-progress: false

env:
  DATA_PATH_SECRET: ${{ secrets.DATA_PATH_SECRET }}
  DATA_ALIAS: live
  ALIAS_ONLY: "true"

permissions:
  contents: read

jobs:

  check:
    if: ${{ !(github.event_name == 'push' && (contains(github.event.head_commit.message, 'no run') || contains(github.event.head_commit.message, 'runs stopped'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # (a run landing late is waited for in its model's job)
    permissions:
      contents: read
      actions: write # the fallback's look at recent runs; keeping the schedule on
    outputs:
      any: ${{ steps.check.outputs.any }}
      models: ${{ steps.check.outputs.models }}
      matrix: ${{ steps.check.outputs.matrix }}
      waits: ${{ steps.check.outputs.waits }}
      active: ${{ steps.check.outputs.active }}
      required: ${{ steps.check.outputs.required }}
      free: ${{ steps.check.outputs.free }}
      free_models: ${{ steps.check.outputs.free_models }}
      airspace: ${{ steps.check.outputs.airspace }}
      mapdata: ${{ steps.check.outputs.mapdata }}
    steps:
      - uses: actions/checkout@v7

      - name: Already run on time?
        id: late
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          CRON: ${{ github.event.schedule }}
        run: cd pipeline && python3 ontime.py

      - name: Data site
        if: steps.late.outputs.skip != 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_DATA_SITE_ID }}
        run: |
          s="$(curl -fsS --retry 3 --max-time 20 -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")" ||
            { echo "::error::couldn't look up the data site: check NETLIFY_AUTH_TOKEN and NETLIFY_DATA_SITE_ID"; exit 1; }
          while IFS= read -r v; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done < <(jq -r '.name, .default_domain, .custom_domain, .url, .ssl_url, .account_slug, .account_name, .account_id, (.domain_aliases // [])[] | select(. != null)' <<<"$s")
          d="$(jq -r '.default_domain // empty' <<<"$s")"
          if [ -z "$d" ]; then echo "::error::the data site has no address"; exit 1; fi
          echo "PROD_URL=https://$d" >> "$GITHUB_ENV"
          echo "ALIAS_URL=https://$DATA_ALIAS--$d" >> "$GITHUB_ENV"
          if [ "$ALIAS_ONLY" = true ]; then echo "DATA_URL=https://$DATA_ALIAS--$d" >> "$GITHUB_ENV"; else echo "DATA_URL=https://$d" >> "$GITHUB_ENV"; fi
          if [ -n "$DATA_PATH_SECRET" ]; then
            if ! [[ "$DATA_PATH_SECRET" =~ ^[A-Za-z0-9_-]{16,}$ ]]; then echo "DATA_PATH_SECRET must be 16+ letters, digits, - or _"; exit 1; fi
            O="o$(printf '%s:open' "$DATA_PATH_SECRET" | sha256sum | cut -c1-32)"
            echo "::add-mask::$O"
            echo "OPEN_DIR=/$O" >> "$GITHUB_ENV"
          fi

      - name: Outputs on hand
        id: outs
        if: steps.late.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          o="$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.name | startswith("out-")) and (.expired | not)) | .name | ltrimstr("out-")' | sort -u | paste -sd, -)" ||
            { echo "couldn't list the outputs: taken as all on hand"; exit 0; }
          echo "outs=$o" >> "$GITHUB_OUTPUT"; echo "on hand: ${o:-none}"
          echo "listed=true" >> "$GITHUB_OUTPUT"

      - name: What's new?
        id: check
        if: steps.late.outputs.skip != 'true'
        env:
          SLOT: ${{ inputs.slot || steps.late.outputs.slot }}
          OUTS: ${{ steps.outs.outputs.outs }}
          LISTED: ${{ steps.outs.outputs.listed }}
        run: cd pipeline && python3 check.py --data-url "$DATA_URL${DATA_PATH_SECRET:+/$DATA_PATH_SECRET}" --open-url "$DATA_URL$OPEN_DIR" --slot "$SLOT" ${LISTED:+--outs "$OUTS"} ${{ inputs.force && '--force' || '' }} ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'all models') && '--all-models' || '--missing-only') || '' }}

      - name: Keep the schedule on
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SELF: ${{ github.workflow_ref }}
        run: |
          self="${SELF#*/.github/workflows/}"; self="${self%%@*}"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$self/enable" && echo "kept on"

  hours:
    name: hours (${{ matrix.shard }})
    needs: check
    if: needs.check.outputs.any == 'true' && contains(format(' {0} ', needs.check.outputs.models), ' ecmwf ') && !inputs.recompute
    runs-on: ubuntu-24.04
    timeout-minutes: 150 # up to ~70 waiting for the run (check.py --wait-for)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      WORKERS: "3" # as ECMWF's model job (below)
      M: ecmwf
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Wait for the run
        id: wait
        if: fromJSON(needs.check.outputs.waits)[env.M] != null
        env:
          RUN: ${{ fromJSON(needs.check.outputs.waits)[env.M][0] }}
          UNTIL: ${{ fromJSON(needs.check.outputs.waits)[env.M][1] }}
        run: cd pipeline && python3 check.py --wait-for "$M" --run "$RUN" --until "$UNTIL"
      - name: Hours, share ${{ matrix.shard }}
        if: steps.wait.outputs.landed != 'false'
        run: cd pipeline && python build.py --model "$M" --out ../dist-data --shard ${{ matrix.shard }}/3 ${{ inputs.force && '--force' || '' }}
      - name: Pack them
        id: pack
        run: |
          mkdir -p /tmp/hours
          cd "dist-data/$M/_hours" && ls *.npz > /dev/null 2>&1 || { echo "no hours"; exit 0; }
          pack() { tar -cf - *.npz *.run; }
          if [ -n "$DATA_PATH_SECRET" ]; then pack | openssl enc -aes-256-ctr -pbkdf2 -pass env:DATA_PATH_SECRET -out "/tmp/hours/hours-$M-${{ matrix.shard }}.tar.enc"
          else pack > "/tmp/hours/hours-$M-${{ matrix.shard }}.tar"; fi
          ls -l /tmp/hours
          echo "has=true" >> "$GITHUB_OUTPUT"
      - name: Hand them on
        if: steps.pack.outputs.has == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: hours-${{ env.M }}-${{ matrix.shard }}
          path: /tmp/hours
          retention-days: 1
          compression-level: 0

  model:
    needs: check
    if: needs.check.outputs.matrix != '[]' && needs.check.outputs.matrix != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 180 # up to ~70 waiting for its run (check.py lands), the build up to 100
    permissions:
      contents: read
      actions: write # its store and output (artifacts of earlier runs); dropping the replaced ones
    concurrency:
      group: forecast-model-${{ matrix.model }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.check.outputs.matrix) }}
    env:
      WORKERS: ${{ matrix.model == 'ecmwf' && '3' || '2' }}
      M: ${{ matrix.model }}
      HOUR_SHARDS: "3"
    steps:
      - uses: actions/checkout@v7

      - name: Data site
        if: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_DATA_SITE_ID }}
        run: |
          s="$(curl -fsS --retry 3 --max-time 20 -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")" ||
            { echo "::error::couldn't look up the data site: check NETLIFY_AUTH_TOKEN and NETLIFY_DATA_SITE_ID"; exit 1; }
          while IFS= read -r v; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done < <(jq -r '.name, .default_domain, .custom_domain, .url, .ssl_url, .account_slug, .account_name, .account_id, (.domain_aliases // [])[] | select(. != null)' <<<"$s")
          d="$(jq -r '.default_domain // empty' <<<"$s")"
          if [ -z "$d" ]; then echo "::error::the data site has no address"; exit 1; fi
          echo "PROD_URL=https://$d" >> "$GITHUB_ENV"
          echo "ALIAS_URL=https://$DATA_ALIAS--$d" >> "$GITHUB_ENV"
          if [ "$ALIAS_ONLY" = true ]; then echo "DATA_URL=https://$DATA_ALIAS--$d" >> "$GITHUB_ENV"; else echo "DATA_URL=https://$d" >> "$GITHUB_ENV"; fi
          if [ -n "$DATA_PATH_SECRET" ]; then
            if ! [[ "$DATA_PATH_SECRET" =~ ^[A-Za-z0-9_-]{16,}$ ]]; then echo "DATA_PATH_SECRET must be 16+ letters, digits, - or _"; exit 1; fi
            O="o$(printf '%s:open' "$DATA_PATH_SECRET" | sha256sum | cut -c1-32)"
            echo "::add-mask::$O"
            echo "OPEN_DIR=/$O" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt && cd pipeline && python -m unittest test_physics

      - name: Make room
        run: |
          df -h /
          nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift > /dev/null 2>&1 &

      - name: Find ${{ matrix.model }}'s store
        id: store
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest() { gh api "repos/${{ github.repository }}/actions/artifacts?name=$1&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | select(. != null) | "\(.workflow_run.id) \(.created_at) \(.size_in_bytes)"'; }
          a="$(newest "store-$M")"
          if [ -n "$a" ]; then read -r run at size <<<"$a"; echo "run=$run" >> "$GITHUB_OUTPUT"; echo "store-$M: run $run, $at, $((size / 1048576)) MB"
          else echo "no store-$M on hand"; fi
          o="$(newest "out-$M")"
          if [ -n "$o" ]; then read -r run at size <<<"$o"; echo "out_run=$run" >> "$GITHUB_OUTPUT"; echo "out-$M: run $run, $at, $((size / 1048576)) MB"; fi
      - name: Fetch ${{ matrix.model }}'s published run
        id: fetchrun
        if: steps.store.outputs.out_run != '' && !contains(format(' {0} ', needs.check.outputs.models), format(' {0} ', matrix.model))
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-artifact.sh "out-$M" "${{ steps.store.outputs.out_run }}" /tmp/out
      - name: Fetch ${{ matrix.model }}'s published run (one connection)
        if: steps.fetchrun.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: out-${{ matrix.model }}
          path: /tmp/out
          run-id: ${{ steps.store.outputs.out_run }}
          github-token: ${{ github.token }}
      - name: Fetch ${{ matrix.model }}'s store
        id: fetchstore
        if: steps.store.outputs.run != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-artifact.sh "store-$M" "${{ steps.store.outputs.run }}" /tmp/store
      - name: Fetch ${{ matrix.model }}'s store (one connection)
        if: steps.fetchstore.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: store-${{ matrix.model }}
          path: /tmp/store
          run-id: ${{ steps.store.outputs.run }}
          github-token: ${{ github.token }}
      - name: Unpack ${{ matrix.model }}'s store
        id: unpack
        if: steps.store.outputs.run != ''
        run: |
          mkdir -p dist-data
          f="$(ls /tmp/store/store-"$M".tar* 2> /dev/null | head -1 || true)"
          ok=false
          untar() {
            case "$1" in
              *.enc) openssl enc -d -aes-256-ctr -pbkdf2 -pass env:DATA_PATH_SECRET -in "$1" | tar -C dist-data -xf - ;;
              *) tar -C dist-data -xf "$1" ;;
            esac
          }
          if [ -n "$f" ]; then untar "$f" && ok=true; fi
          rm -rf /tmp/store
          r="$(ls /tmp/out/"$M".tar* 2> /dev/null | head -1 || true)"
          if [ -n "$r" ] && [ "$ok" = true ]; then untar "$r" || { echo "::warning::out-$M didn't unpack"; rm -rf dist-data/"$M"/20*; }; rm -f dist-data/.changed*; fi
          rm -rf /tmp/out
          if [ "$ok" = true ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; du -sh "dist-data/$M"
          else echo "::warning::store-$M didn't unpack: starting $M from nothing"; rm -rf "dist-data/$M" "dist-data/free/$M" "dist-data/free/now/$M"; fi
      - name: Restore ${{ matrix.model }} data (cache)
        if: steps.unpack.outputs.ok != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            dist-data/${{ matrix.model }}
            dist-data/free/${{ matrix.model }}
            dist-data/free/now/${{ matrix.model }}
          key: forecast-${{ matrix.model }}-none
          restore-keys: forecast-${{ matrix.model }}-

      - name: Build ${{ matrix.model }}?
        id: what
        env:
          MODELS: ${{ needs.check.outputs.models }}
          OUT_RUN: ${{ steps.store.outputs.out_run }}
        run: |
          build=false
          if [[ " $MODELS " == *" $M "* ]]; then build=true; fi
          run="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['runId'])" "dist-data/$M/latest.json" 2>/dev/null || true)"
          if [ -z "$run" ] || [ ! -d "dist-data/$M/$run" ]; then
            if [ "$build" != true ]; then echo "$M: published run not on hand, building it"; fi
            if [ -n "$run" ] && [ -z "$OUT_RUN" ]; then mv "dist-data/$M/latest.json" "dist-data/$M/latest.json.before"; fi
            build=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "free=$(cd pipeline && python -c "import build; print('true' if '$M' in build.FREE_MODELS else 'false')")" >> "$GITHUB_OUTPUT"
          if [ ! -f "dist-data/free/$M/latest.json" ]; then echo "free_missing=true" >> "$GITHUB_OUTPUT"; fi

      - name: Netlify CLI
        uses: actions/cache@v6
        with:
          path: /tmp/netlify-cli
          key: netlify-cli-17.38.1

      - name: Wait for ${{ matrix.model }}'s run
        if: steps.what.outputs.build == 'true' && fromJSON(needs.check.outputs.waits)[matrix.model] != null
        env:
          RUN: ${{ fromJSON(needs.check.outputs.waits)[matrix.model][0] }}
          UNTIL: ${{ fromJSON(needs.check.outputs.waits)[matrix.model][1] }}
        run: cd pipeline && python3 check.py --wait-for "$M" --run "$RUN" --until "$UNTIL"

      - name: Build ${{ matrix.model }}
        id: build
        if: steps.what.outputs.build == 'true'
        continue-on-error: true
        timeout-minutes: 100
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_DATA_SITE_ID }}
          MODELS: ${{ needs.check.outputs.models }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pin=""
          if [ "$M" = ecmwf ] && [[ " $MODELS " == *" $M "* ]] && [ "${{ inputs.recompute && 'yes' || '' }}" != yes ]; then
            rm -f "dist-data/$M/_hours/SHARD_RUN"
            if (cd pipeline && python build.py --model "$M" --out ../dist-data --shard "0/$HOUR_SHARDS" ${{ inputs.force && '--force' || '' }}); then
              pin="$(cat "dist-data/$M/_hours/SHARD_RUN" 2> /dev/null || true)"
            else echo "::warning::$M's first share failed: the build computes its hours"; fi
            rm -f "dist-data/$M/_hours/SHARD_RUN"
            .github/scripts/shard-hours.sh "$M" "$HOUR_SHARDS"
          fi
          (cd pipeline && python build.py --model "$M" --out ../dist-data ${pin:+--run "$pin"} ${{ inputs.force && '--force' || '' }} ${{ inputs.recompute && '--recompute' || '' }})
          .github/scripts/pre-upload.sh "$M"
          df -h / && du -sh "dist-data/$M" "dist-data/$M/_hours" 2>/dev/null || true

      - name: ${{ matrix.model }}'s published run on hand?
        id: onhand
        run: |
          if [ -f "dist-data/$M/latest.json.before" ]; then
            if [ ! -f "dist-data/$M/latest.json" ]; then mv "dist-data/$M/latest.json.before" "dist-data/$M/latest.json"; else rm -f "dist-data/$M/latest.json.before"; fi
          fi
          run="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['runId'])" "dist-data/$M/latest.json" 2>/dev/null || true)"
          if [ -n "$run" ] && [ ! -d "dist-data/$M/$run" ]; then echo "fetch=true" >> "$GITHUB_OUTPUT"; echo "$M: run $run not on hand, fetching it"; fi
      - name: Fetch ${{ matrix.model }}'s published run (not built)
        id: fetchlate
        if: steps.onhand.outputs.fetch == 'true' && steps.store.outputs.out_run != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-artifact.sh "out-$M" "${{ steps.store.outputs.out_run }}" /tmp/out
      - name: Fetch ${{ matrix.model }}'s published run (not built, one connection)
        if: steps.fetchlate.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: out-${{ matrix.model }}
          path: /tmp/out
          run-id: ${{ steps.store.outputs.out_run }}
          github-token: ${{ github.token }}
      - name: Unpack ${{ matrix.model }}'s published run (not built)
        if: steps.onhand.outputs.fetch == 'true' && steps.store.outputs.out_run != ''
        continue-on-error: true
        run: |
          r="$(ls /tmp/out/"$M".tar* 2> /dev/null | head -1 || true)"
          [ -n "$r" ] || { echo "::warning::out-$M not fetched"; exit 0; }
          case "$r" in
            *.enc) openssl enc -d -aes-256-ctr -pbkdf2 -pass env:DATA_PATH_SECRET -in "$r" | tar -C dist-data -xf - "$M" ;;
            *) tar -C dist-data -xf "$r" "$M" ;;
          esac
          rm -rf /tmp/out

      - name: Free 24-hour window
        if: steps.what.outputs.free == 'true' && (contains(needs.check.outputs.free_models, format('"{0}"', matrix.model)) || steps.build.outcome == 'success' || steps.what.outputs.free_missing == 'true')
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_DATA_SITE_ID }}
        run: |
          (cd pipeline && python build.py --model "$M" --out ../dist-data --free-only)
          .github/scripts/pre-upload.sh free

      - name: Hand ${{ matrix.model }} on
        id: hand
        run: |
          .github/scripts/pre-upload.sh --wait
          if [ -f dist-data/.changed ]; then mv dist-data/.changed "dist-data/.changed-$M"; else echo "$M: nothing new"; exit 0; fi
          [ -f "dist-data/$M/latest.json" ] || { echo "::warning::$M has nothing to publish"; exit 0; }
          mkdir -p /tmp/hand
          parts=$(cd dist-data && ls -d "$M" "free/$M" "free/now/$M" ".changed-$M" 2> /dev/null || true)
          pack() { tar -C dist-data --exclude=_hours --exclude=_quarters --exclude='*.building' -cf - $parts; }
          if [ -n "$DATA_PATH_SECRET" ]; then pack | openssl enc -aes-256-ctr -pbkdf2 -pass env:DATA_PATH_SECRET -out "/tmp/hand/$M.tar.enc"
          else pack > "/tmp/hand/$M.tar"; fi
          ls -l /tmp/hand
          echo "has=true" >> "$GITHUB_OUTPUT"

      - name: Keep ${{ matrix.model }}'s output
        id: keep
        if: steps.hand.outputs.has == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: out-${{ matrix.model }}
          path: /tmp/hand
          retention-days: 3 # the repo's maximum (Settings → Actions); a model not built in 3 days is built again (check.py)
          compression-level: 0 # tiles and packs are compressed already; encrypted, it doesn't compress

      - name: Pack ${{ matrix.model }}'s store
        id: pack
        if: steps.build.outcome == 'success' && steps.hand.outputs.has == 'true'
        continue-on-error: true
        run: |
          rm -rf /tmp/hand
          mkdir -p /tmp/store-out
          parts=$(cd dist-data && ls -d "$M" "free/$M" "free/now/$M" 2> /dev/null || true)
          enc() { if [ -n "$DATA_PATH_SECRET" ]; then openssl enc -aes-256-ctr -pbkdf2 -pass env:DATA_PATH_SECRET -out "$1.enc"; else cat > "$1"; fi; }
          tar -C dist-data --exclude='*.building' --anchored --exclude="$M/20*" -cf - $parts | enc "/tmp/store-out/store-$M.tar"
          ls -l /tmp/store-out
      - name: Save ${{ matrix.model }}'s store for the next run
        id: save
        if: steps.pack.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: store-${{ matrix.model }}
          path: /tmp/store-out
          retention-days: 3
          compression-level: 0
      - name: Drop replaced stores
        if: steps.save.outcome == 'success' || steps.keep.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MINE: ${{ steps.save.outputs.artifact-id }}
        run: |
          drop() { # name, how many of the newest kept
            gh api "repos/${{ github.repository }}/actions/artifacts?name=$1&per_page=100" --jq '.artifacts | sort_by(.created_at) | reverse | .[] | "\(.id) \(.workflow_run.id)"' |
            tail -n +$(($2 + 1)) | while read -r id run; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" > /dev/null && echo "deleted $1 of run $run"
            done
          }
          if [ -n "$MINE" ]; then drop "store-$M" 1; fi
          drop "out-$M" 2
          drop "store-run-$M" 0
          gh api --paginate "repos/${{ github.repository }}/actions/caches?key=forecast-$M-&per_page=100" --jq '.actions_caches[] | "\(.id) \(.key)"' |
          while read -r id key; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" > /dev/null && echo "deleted cache $key"
          done

  mapdata:
    needs: check
    if: needs.check.outputs.mapdata == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write # dropping the replaced caches and outputs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Restore map data
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: dist-data/airspace
          key: forecast-mapdata-${{ github.run_id }}
          restore-keys: forecast-mapdata-
      - name: Restore map data (one-job layout)
        if: steps.restore.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: |
            dist-data
            !dist-data/gfs
            !dist-data/hrrr/20*
          key: forecast-main-none
          restore-keys: forecast-main-
      - name: Only the map data
        run: find dist-data -mindepth 1 -maxdepth 1 ! -name airspace -exec rm -rf {} + 2> /dev/null || true

      - name: Map data on hand?
        id: mapdata
        run: |
          if [ -f dist-data/airspace/meta.json ] && [ -f dist-data/airspace/aviation/meta.json ]; then echo "missing=false" >> "$GITHUB_OUTPUT"
          else echo "missing=true" >> "$GITHUB_OUTPUT"; echo "No airspace or aviation map data on hand: building them"; fi

      - name: Airspace
        if: needs.check.outputs.airspace == 'true' || steps.mapdata.outputs.missing == 'true'
        continue-on-error: true
        timeout-minutes: 25
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: cd pipeline && python airspace.py --out ../dist-data

      - name: Aviation map data
        if: needs.check.outputs.airspace == 'true' || steps.mapdata.outputs.missing == 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: cd pipeline && python aviation.py --out ../dist-data

      - name: Chart overviews
        continue-on-error: true
        timeout-minutes: 20
        run: cd pipeline && python chart_tiles.py --out ../dist-data

      - name: Hand it on
        id: hand
        run: |
          if [ -f dist-data/.changed ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          rm -f dist-data/.changed
          [ -f dist-data/airspace/meta.json ] || { echo "::warning::no map data to keep"; exit 0; }
          mkdir -p /tmp/hand
          tar -C dist-data -cf /tmp/hand/mapdata.tar airspace
          echo "has=true" >> "$GITHUB_OUTPUT"
      - name: Keep the map data
        id: keep
        if: steps.hand.outputs.has == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: out-mapdata
          path: /tmp/hand
          retention-days: 3
          compression-level: 6
      - name: Drop replaced outputs
        if: steps.keep.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts?name=out-mapdata&per_page=100" --jq '.artifacts | sort_by(.created_at) | reverse | .[] | "\(.id) \(.workflow_run.id)"' |
          tail -n +3 | while read -r id run; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" > /dev/null && echo "deleted out-mapdata of run $run"
          done
      - name: Save map data for the next run
        if: steps.hand.outputs.changed == 'true' || steps.restore.outputs.cache-matched-key == ''
        uses: actions/cache/save@v6
        with:
          path: dist-data/airspace
          key: forecast-mapdata-${{ github.run_id }}
      - name: Drop replaced caches
        if: steps.hand.outputs.changed == 'true' || steps.restore.outputs.cache-matched-key == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mine="$(gh api "repos/${{ github.repository }}/actions/caches?key=forecast-mapdata-${{ github.run_id }}" --jq '.total_count')"
          [ "$mine" -ge 1 ] || exit 0
          gh api --paginate "repos/${{ github.repository }}/actions/caches?per_page=100" --jq '.actions_caches[] | "\(.id) \(.key)"' |
          while read -r id key; do
            case "$key" in
              forecast-mapdata-${{ github.run_id }}) ;;
              forecast-mapdata-*|forecast-main-*|forecast-data-*) gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" > /dev/null && echo "deleted $key" ;;
            esac
          done

  publish:
    needs: check
    if: needs.check.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read # the outputs (artifacts) and this run's jobs
    env:
      ACTIVE: ${{ needs.check.outputs.active }}
      REQUIRED: ${{ needs.check.outputs.required }}
    steps:
      - uses: actions/checkout@v7

      - name: Data site
        if: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_DATA_SITE_ID }}
        run: |
          s="$(curl -fsS --retry 3 --max-time 20 -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")" ||
            { echo "::error::couldn't look up the data site: check NETLIFY_AUTH_TOKEN and NETLIFY_DATA_SITE_ID"; exit 1; }
          while IFS= read -r v; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done < <(jq -r '.name, .default_domain, .custom_domain, .url, .ssl_url, .account_slug, .account_name, .account_id, (.domain_aliases // [])[] | select(. != null)' <<<"$s")
          d="$(jq -r '.default_domain // empty' <<<"$s")"
          if [ -z "$d" ]; then echo "::error::the data site has no address"; exit 1; fi
          echo "PROD_URL=https://$d" >> "$GITHUB_ENV"
          echo "ALIAS_URL=https://$DATA_ALIAS--$d" >> "$GITHUB_ENV"
          if [ "$ALIAS_ONLY" = true ]; then echo "DATA_URL=https://$DATA_ALIAS--$d" >> "$GITHUB_ENV"; else echo "DATA_URL=https://$d" >> "$GITHUB_ENV"; fi
          if [ -n "$DATA_PATH_SECRET" ]; then
            if ! [[ "$DATA_PATH_SECRET" =~ ^[A-Za-z0-9_-]{16,}$ ]]; then echo "DATA_PATH_SECRET must be 16+ letters, digits, - or _"; exit 1; fi
            O="o$(printf '%s:open' "$DATA_PATH_SECRET" | sha256sum | cut -c1-32)"
            echo "::add-mask::$O"
            echo "OPEN_DIR=/$O" >> "$GITHUB_ENV"
          fi

      - name: Netlify CLI
        uses: actions/cache@v6
        with:
          path: /tmp/netlify-cli
          key: netlify-cli-17.38.1

      - name: Deploy the newest outputs
        env:
          GH_TOKEN: ${{ github.token }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_DATA_SITE_ID }}
        run: .github/scripts/publish-data.sh sync

  cleanup:
    needs: [check, hours, model, mapdata, publish]
    if: always() && needs.check.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Drop the hand-off files
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --jq '.artifacts[] | select((.name | startswith("store-") or startswith("out-")) | not) | "\(.id) \(.name)"' |
          while read -r id name; do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" > /dev/null && echo "deleted $name"; done
      - name: Delete old runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SELF: ${{ github.workflow_ref }}
          MESSAGE: ${{ github.event_name == 'push' && github.event.head_commit.message || '' }}
        run: |
          before="$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$MESSAGE" == *"runs cleared"* ]]; then before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; echo "clearing every finished run"; fi
          self=".github/workflows/${SELF#*/.github/workflows/}"; self="${self%%@*}"
          ids="$(gh api --paginate "repos/${{ github.repository }}/actions/runs?status=completed&per_page=100" \
            --jq ".workflow_runs[] | select(((.path | startswith(\".github/workflows/forecast-data\")) and (.path != \"$self\" or .created_at < \"$before\")) or ((.path == \".github/workflows/fronts-train.yml\" or .path == \".github/workflows/verify.yml\") and .created_at < \"$before\")) | .id")"
          keep="$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.name | startswith("store-") or startswith("out-") or startswith("verify-")) and (.expired | not)) | .workflow_run.id')" || { echo "couldn't list the stores: nothing deleted"; exit 0; }
          for id in $ids; do
            if grep -qx "$id" <<<"$keep"; then echo "kept $id (a store or an output)"; continue; fi
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" > /dev/null && echo "deleted $id"
          done
