name: Verify
on:
  schedule:
    - cron: "10 7,19 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: verify
  cancel-in-progress: false
env:
  DATA_PATH_SECRET: ${{ secrets.DATA_PATH_SECRET }}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      go: ${{ steps.when.outputs.go }}
      deadline: ${{ steps.when.outputs.deadline }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pipeline/check.py
          sparse-checkout-cone-mode: false
      - name: Between forecast runs?
        id: when
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 0 20); do
            busy=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=40" \
              --jq '[.workflow_runs[] | select((.name | startswith("Forecast data")) and .status != "completed")] | length')
            [ "$busy" = 0 ] && break
            [ $i -lt 20 ] && sleep 60
          done
          python3 - "$busy" >> "$GITHUB_OUTPUT" <<'PY'
          import ast, sys
          from datetime import datetime, timedelta, timezone
          tree = ast.parse(open("pipeline/check.py").read())
          slots = next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and getattr(n.targets[0], "id", "") == "SLOTS")
          now = datetime.now(timezone.utc)
          times = [(now + timedelta(days=d)).replace(hour=int(s[:2]), minute=int(s[3:]), second=0, microsecond=0) for d in (-1, 0, 1) for s in slots]
          nxt, prev = min(t for t in times if t > now), max(t for t in times if t <= now)
          deadline = nxt - timedelta(minutes=10)
          left, since, busy = (deadline - now).total_seconds() / 60, (now - prev).total_seconds() / 60, int(sys.argv[1])
          print(f"deadline {deadline:%H:%M}Z, {left:.0f} min left, {since:.0f} min since the {prev:%H:%M}Z slot, forecast runs going: {busy}", file=sys.stderr)
          print(f"deadline={deadline:%Y-%m-%dT%H:%MZ}")
          print(f"go={'true' if busy == 0 and left >= 15 and since >= 10 else 'false'}")
          PY
  obs:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      KEY: obs
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Restore
        run: bash .github/scripts/verify-state.sh restore "$KEY" state
      - name: Reports
        continue-on-error: true
        run: cd pipeline && python verify.py obs --state ../state --deadline "${{ needs.gate.outputs.deadline }}"
      - name: Pack
        if: always()
        run: bash .github/scripts/verify-state.sh pack "$KEY" state
      - id: up
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-${{ env.KEY }}
          path: /tmp/verify-out
          retention-days: 3
          compression-level: 0
      - if: always() && steps.up.outputs.artifact-id != ''
        run: bash .github/scripts/verify-state.sh drop "$KEY" "${{ steps.up.outputs.artifact-id }}"
  sample:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - { model: hrrr, key: hrrr, part: "" }
          - { model: gfs, key: gfs, part: "" }
          - { model: ecmwf, key: ecmwf-0, part: "0/2" }
          - { model: ecmwf, key: ecmwf-1, part: "1/2" }
          - { model: icon, key: icon, part: "" }
          - { model: icond2, key: icond2, part: "" }
    env:
      KEY: ${{ matrix.key }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Restore
        run: bash .github/scripts/verify-state.sh restore "$KEY" state
      - name: Rebuild and sample ${{ matrix.model }}'s runs
        continue-on-error: true
        run: cd pipeline && python verify.py sample --model "${{ matrix.model }}" --state ../state --deadline "${{ needs.gate.outputs.deadline }}" ${{ matrix.part && format('--part {0}', matrix.part) || '' }}
      - name: Pack
        if: always()
        run: bash .github/scripts/verify-state.sh pack "$KEY" state
      - id: up
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-${{ env.KEY }}
          path: /tmp/verify-out
          retention-days: 3
          compression-level: 0
      - if: always() && steps.up.outputs.artifact-id != ''
        run: bash .github/scripts/verify-state.sh drop "$KEY" "${{ steps.up.outputs.artifact-id }}"
  score:
    needs: [gate, obs, sample]
    if: always() && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Restore
        run: |
          for k in obs hrrr gfs ecmwf-0 ecmwf-1 icon icond2; do bash .github/scripts/verify-state.sh restore "$k" "s/$k"; done
      - name: Score
        run: cd pipeline && python verify.py score --samples ../s/hrrr ../s/gfs ../s/ecmwf-0 ../s/ecmwf-1 ../s/icon ../s/icond2 --obs ../s/obs --out ../scores.json
      - uses: actions/upload-artifact@v7
        with:
          name: scores
          path: scores.json
          retention-days: 3
