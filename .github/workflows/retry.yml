name: Retry
on:
  workflow_run:
    workflows: ["Forecast data"]
    types: [completed]
permissions:
  actions: write
  contents: read
jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Run the failed jobs again
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          gh run rerun "$RUN" --failed -R "${{ github.repository }}"
          echo "run $RUN: its failed jobs asked again"
